<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Alli — FSE" />
  <title>Alli — Morning Practice</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f0ebe3; font-family: 'Georgia', serif; -webkit-font-smoothing: antialiased; }
    ::-webkit-scrollbar { display: none; }
    textarea, input { -webkit-appearance: none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // ── localStorage helpers ──────────────────────────────────────────────────
    const save = (key, val) => { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} };
    const load = (key, fallback) => { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch(e) { return fallback; } };

    // Reset checklist items daily
    const todayKey = () => new Date().toISOString().slice(0, 10);

    function usePersist(key, fallback) {
      const [val, setVal] = useState(() => load(key, fallback));
      useEffect(() => { save(key, val); }, [key, val]);
      return [val, setVal];
    }

    function useDailyChecks(key) {
      const storageKey = `${key}_${todayKey()}`;
      const [val, setVal] = useState(() => load(storageKey, {}));
      useEffect(() => { save(storageKey, val); }, [storageKey, val]);
      return [val, setVal];
    }

    const TODAY = new Date().toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
    const TABS = [
      { id: "morning", label: "Ritual" },
      { id: "walk", label: "Walk" },
      { id: "nutrition", label: "Nutrition" },
      { id: "fascia", label: "Fascia" },
      { id: "workouts", label: "Workouts" },
      { id: "lifts", label: "Lifts" },
    ];

    const S = {
      app: { minHeight: "100vh", background: "#f0ebe3", fontFamily: "'Georgia', serif", color: "#1a1a1a", maxWidth: "480px", margin: "0 auto" },
      hero: { padding: "36px 24px 0" },
      eyebrow: { fontSize: "11px", letterSpacing: "2px", textTransform: "uppercase", color: "#888", marginBottom: "10px" },
      title: { fontSize: "32px", fontWeight: "normal", lineHeight: "1.2", marginBottom: "6px" },
      italic: { color: "#4a6b56", fontStyle: "italic" },
      date: { fontSize: "14px", color: "#888" },
      tabBar: { display: "flex", borderBottom: "1px solid #ddd", padding: "0 24px", gap: "24px", overflowX: "auto", marginTop: "20px" },
      tab: (a) => ({ padding: "12px 0", fontSize: "14px", fontWeight: a ? "bold" : "normal", color: a ? "#1a1a1a" : "#aaa", border: "none", borderBottom: a ? "2px solid #3d5a47" : "2px solid transparent", background: "transparent", cursor: "pointer", whiteSpace: "nowrap", fontFamily: "Georgia, serif", marginBottom: "-1px", transition: "all 0.2s" }),
      body: { padding: "24px" },
      pill: { display: "inline-block", background: "#e5e0d8", color: "#555", fontSize: "10px", letterSpacing: "1.5px", textTransform: "uppercase", padding: "5px 12px", borderRadius: "20px", marginBottom: "14px" },
      intro: { fontSize: "15px", color: "#555", lineHeight: "1.6", marginBottom: "20px" },
      card: (on) => ({ background: on ? "#eaf0e8" : "#fff", border: `1px solid ${on ? "#c8d8c2" : "#e8e2da"}`, borderRadius: "16px", padding: "16px 18px", marginBottom: "10px", display: "flex", alignItems: "center", gap: "14px", cursor: "pointer", transition: "all 0.2s" }),
      icon: { fontSize: "22px", width: "32px", textAlign: "center", flexShrink: 0 },
      cardBody: { flex: 1 },
      cardTitle: (on) => ({ fontSize: "15px", fontWeight: "bold", color: on ? "#3d5a47" : "#1a1a1a", marginBottom: "2px" }),
      cardDesc: { fontSize: "12px", color: "#888", lineHeight: "1.4" },
      toggle: (on) => ({ width: "28px", height: "28px", borderRadius: "50%", border: `2px solid ${on ? "#3d5a47" : "#ccc"}`, background: on ? "#3d5a47" : "transparent", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, transition: "all 0.2s" }),
      section: { background: "#fff", border: "1px solid #e8e2da", borderRadius: "16px", padding: "18px", marginBottom: "12px" },
      sTitle: { fontSize: "16px", fontWeight: "bold", marginBottom: "4px" },
      sSub: { fontSize: "11px", color: "#888", letterSpacing: "0.5px", marginBottom: "12px" },
      row: (last) => ({ display: "flex", justifyContent: "space-between", alignItems: "flex-start", padding: "8px 0", borderBottom: last ? "none" : "1px solid #f5f0eb" }),
      rLabel: { fontSize: "13px", fontWeight: "bold", flex: 1 },
      rNote: { fontSize: "11px", color: "#888", marginTop: "2px", lineHeight: "1.4" },
      rRight: { fontSize: "12px", color: "#3d5a47", fontWeight: "bold", textAlign: "right", flexShrink: 0, marginLeft: "12px" },
      note: { background: "#f7f3ee", border: "1px solid #e8e2da", borderRadius: "12px", padding: "14px 16px", marginTop: "14px", fontSize: "12px", fontStyle: "italic", color: "#666", lineHeight: "1.6" },
      btn: (a) => ({ padding: "7px 16px", borderRadius: "20px", fontSize: "12px", fontWeight: a ? "bold" : "normal", background: a ? "#3d5a47" : "#e5e0d8", color: a ? "#fff" : "#555", border: "none", cursor: "pointer", fontFamily: "Georgia, serif", transition: "all 0.2s" }),
      tag: (c) => ({ display: "inline-block", background: c || "#e5e0d8", color: c ? "#fff" : "#555", fontSize: "10px", padding: "3px 10px", borderRadius: "20px", marginRight: "5px", marginBottom: "4px" }),
      input: { background: "#f7f3ee", border: "1px solid #e8e2da", borderRadius: "8px", color: "#1a1a1a", padding: "6px 10px", fontSize: "13px", width: "100%", outline: "none", fontFamily: "Georgia, serif", boxSizing: "border-box" },
      savedBadge: { fontSize: "10px", color: "#3d5a47", fontStyle: "italic", textAlign: "right", marginTop: "4px", letterSpacing: "0.3px" },
    };

    function CheckItem({ icon, title, desc, checked, onToggle }) {
      return (
        <div style={S.card(checked)} onClick={onToggle}>
          <div style={S.icon}>{icon}</div>
          <div style={S.cardBody}>
            <div style={S.cardTitle(checked)}>{title}</div>
            <div style={S.cardDesc}>{desc}</div>
          </div>
          <div style={S.toggle(checked)}>
            {checked && <span style={{ color: "#fff", fontSize: "14px", fontWeight: "bold" }}>✓</span>}
          </div>
        </div>
      );
    }

    function MorningTab() {
      const [checked, setChecked] = useDailyChecks("morning_checks");
      const toggle = (k) => setChecked((c) => ({ ...c, [k]: !c[k] }));
      const items = [
        { id: "water", icon: "💧", title: "16–20 oz Water", desc: "Before coffee. Before anything. Rehydrate from overnight." },
        { id: "breathe", icon: "🌬", title: "360 Breathing — 5 min", desc: "Lying on back, knees bent. Inhale — ribcage expands, belly rises, pelvic floor gently drops. Exhale slowly. Just breathe and feel." },
        { id: "pelvic", icon: "🌿", title: "Pelvic Floor Check-In", desc: "One conscious release. Inhale and let the pelvic floor soften. Then one gentle lift on the exhale. Just to reconnect." },
        { id: "gut", icon: "🫁", title: "Gut Check", desc: "Rate your digestion 1–5. If it's a 3 or below — flat water today, warm foods first." },
        { id: "intention", icon: "✨", title: "Set One Intention", desc: "One word or one sentence. Write it or say it out loud. What does your body need from you today?" },
      ];
      const done = Object.values(checked).filter(Boolean).length;
      return (
        <div>
          <div style={S.pill}>First thing · Every day</div>
          <p style={S.intro}>Before everything else. These are yours. Check them off and start your day from a full place.</p>
          {done === items.length && (
            <div style={{ ...S.note, background: "#eaf0e8", border: "1px solid #c8d8c2", color: "#3d5a47", marginBottom: "14px", fontStyle: "normal", fontWeight: "bold" }}>
              ✓ Morning ritual complete. Your nervous system thanks you.
            </div>
          )}
          {items.map((item) => <CheckItem key={item.id} {...item} checked={!!checked[item.id]} onToggle={() => toggle(item.id)} />)}
          {done > 0 && <div style={S.savedBadge}>✓ Saved automatically</div>}
          <div style={S.note}>From Christin: Your morning sets the tone for your nervous system for the entire day. You carry a stressful job into every afternoon — this practice is how you protect your body before the day takes over.</div>
        </div>
      );
    }

    function WalkTab() {
      const [checked, setChecked] = useDailyChecks("walk_checks");
      const toggle = (k) => setChecked((c) => ({ ...c, [k]: !c[k] }));
      const items = [
        { id: "walk", icon: "🚶‍♀️", title: "20–30 Minute Walk", desc: "Outdoors when possible. Treadmill is fine. Movement, not pace." },
        { id: "nowork", icon: "📵", title: "No Work During Walk", desc: "No emails. No stressful podcasts. Music, something light, or nothing. This is decompression time." },
        { id: "water", icon: "💧", title: "Bring Water", desc: "Sparkling or flat — based on your gut today. Lemon or lime. No sweetened drinks." },
      ];
      const done = Object.values(checked).filter(Boolean).length;
      return (
        <div>
          <div style={S.pill}>Daily movement</div>
          <p style={S.intro}>Walking is the most underrated tool you have. It lowers cortisol, supports gut motility, and costs you nothing.</p>
          {items.map((item) => <CheckItem key={item.id} {...item} checked={!!checked[item.id]} onToggle={() => toggle(item.id)} />)}
          {done > 0 && <div style={S.savedBadge}>✓ Saved automatically</div>}
          <div style={S.section}>
            <div style={S.sTitle}>On High Stress Days</div>
            <div style={S.sSub}>When your stress is a 4 or 5</div>
            <p style={{ fontSize: "13px", color: "#555", lineHeight: "1.6", margin: 0 }}>Walk instead of doing your extra workout. A 30-minute walk when you are running on empty does more for your body than a hard class would. This is not a lesser option — it is the smarter one.</p>
          </div>
          <div style={S.section}>
            <div style={S.sTitle}>Timing</div>
            {[["Morning walk", "Before cortisol from the workday builds", "Best"], ["After dinner", "Supports blood sugar and digestion", "Great"], ["Any time", "Done is better than perfect", "Good"]].map(([l, n, r], i) => (
              <div key={i} style={S.row(i === 2)}><div><div style={S.rLabel}>{l}</div><div style={S.rNote}>{n}</div></div><div style={S.rRight}>{r}</div></div>
            ))}
          </div>
        </div>
      );
    }

    function NutritionTab() {
      const meals = [["Breakfast", "30–35g", "Eggs + egg whites, Greek yogurt, or cottage cheese"], ["Lunch", "35–40g", "Chicken, turkey, or fish with vegetables and a complex carb"], ["Dinner", "35–40g", "Protein + carb + fat — balanced plate"], ["Snack", "20–25g", "Greek yogurt, protein shake, hard boiled eggs"]];
      const rules = [["1", "Protein first at every meal", "Eat protein before anything else. Stabilizes blood sugar, reduces cravings."], ["2", "Fiber every day", "Vegetables, fruit, legumes, whole grains. Aim for 25g+."], ["3", "Water all day", "Half your body weight in ounces. Sparkling with lemon/lime/cranberry counts. Flat on tough gut days."]];
      const gutTips = ["Chew slowly. Your gut starts in your mouth.", "Warm foods first in the morning — easier on digestion.", "Sparkling water is fine on calm gut days. Switch to flat when bloated.", "Alcohol disrupts gut lining and worsens endo symptoms. Be honest about what it costs you.", "If your gut is off — track what you ate 24 hours before. Patterns will appear."];
      return (
        <div>
          <div style={S.pill}>Protein · Fiber · Water</div>
          <p style={S.intro}>Three rules. Every day. In that order.</p>
          <div style={S.section}>
            <div style={S.sTitle}>The Three Rules</div>
            <div style={S.sSub}>Non-negotiable</div>
            {rules.map(([num, title, desc], i) => (
              <div key={num} style={S.row(i === 2)}>
                <div style={{ display: "flex", gap: "12px" }}>
                  <div style={{ background: "#3d5a47", color: "#fff", borderRadius: "50%", width: "20px", height: "20px", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "10px", fontWeight: "bold", flexShrink: 0, marginTop: "2px" }}>{num}</div>
                  <div><div style={S.rLabel}>{title}</div><div style={S.rNote}>{desc}</div></div>
                </div>
              </div>
            ))}
          </div>
          <div style={S.section}>
            <div style={S.sTitle}>Protein by Meal</div>
            {meals.map(([meal, protein, example], i) => (
              <div key={meal} style={S.row(i === 3)}><div><div style={S.rLabel}>{meal}</div><div style={S.rNote}>{example}</div></div><div style={S.rRight}>{protein}</div></div>
            ))}
          </div>
          <div style={S.section}>
            <div style={S.sTitle}>Gut Health Notes</div>
            {gutTips.map((tip, i) => (
              <div key={i} style={{ ...S.row(i === 4), alignItems: "flex-start" }}>
                <div style={{ color: "#3d5a47", marginRight: "10px", flexShrink: 0 }}>→</div>
                <div style={{ fontSize: "13px", color: "#444", lineHeight: "1.5" }}>{tip}</div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function FasciaTab() {
      const gun = [["Upper back & traps", "Medium speed. Move slowly. Don't park it.", "60–90 sec / side"], ["Glutes", "Just below the waistband. Full glute, not just center.", "60 sec / side"], ["Hamstrings", "Seated or face down. Long strokes sit bone to knee.", "60 sec / side"], ["Hip flexors", "Light pressure. Let it warm up first.", "45 sec / side"], ["Thoracic spine", "Either side of the spine — not directly on it.", "60 sec"]];
      const mob = [["Child's Pose", "Knees wide. Breathe into low back. Let hips sink.", "60–90 sec"], ["Cat-Cow", "Inhale into cow, exhale into cat. Move with breath.", "10 slow reps"], ["Figure Four", "Lying on back. Flex foot. Press knee gently away.", "60 sec / side"], ["Thoracic Rotation", "Side lying. Top arm opens to ceiling.", "8 reps / side"], ["Hip Flexor Stretch", "Low lunge. Tuck pelvis. Don't arch the low back.", "45 sec / side"], ["90/90 Hip", "Both legs at 90 degrees. Sit tall. Breathe in.", "60 sec / side"]];
      return (
        <div>
          <div style={S.pill}>5–15 min · Fascia release</div>
          <p style={S.intro}>Lymphatic flow · nervous system reset · circulation primer</p>
          <div style={S.section}>
            <div style={S.sTitle}>Massage Gun</div>
            <div style={S.sSub}>Before workout or evening — not immediately post-workout</div>
            {gun.map(([area, note, time], i) => <div key={i} style={S.row(i === gun.length - 1)}><div><div style={S.rLabel}>{area}</div><div style={S.rNote}>{note}</div></div><div style={S.rRight}>{time}</div></div>)}
          </div>
          <div style={S.section}>
            <div style={S.sTitle}>Mobility Sequence</div>
            <div style={S.sSub}>Hold each. Breathe into it. Let breath create space.</div>
            {mob.map(([name, note, hold], i) => <div key={i} style={S.row(i === mob.length - 1)}><div><div style={S.rLabel}>{name}</div><div style={S.rNote}>{note}</div></div><div style={S.rRight}>{hold}</div></div>)}
          </div>
        </div>
      );
    }

    function WorkoutsTab() {
      const [active, setActive] = usePersist("workouts_active", "D1");
      const WO = {
        D1: {
          label: "Day 1 — Glute Focus", sub: "Unilateral · On Your Own",
          warmup: ["Banded Lateral Walk — 10 / side", "Bodyweight Glute Bridge — 15 reps"],
          exercises: [
            { name: "Box Step-Up (12\")", sets: "3 sets", reps: "10 / side", weight: "15–20 lbs DB", note: "Drive through the heel on the box, not the trailing leg. Control the step down." },
            { name: "Single-Leg Hip Thrust", sets: "3 sets", reps: "10 / side", weight: "Bodyweight or light bar", note: "Don't rush. Control the drop. Squeeze hard at the top." },
            { name: "Single-Leg RDL (DB)", sets: "3 sets", reps: "8 / side", weight: "15–25 lbs", note: "Hinge from the hip. Square hips to the floor. Slow and controlled — this is balance work too." },
            { name: "Banded Lateral Walk", sets: "3 sets", reps: "12 / side", weight: "Band", note: "Stay low. Knees track over toes. Keep tension on the band the whole time." },
            { name: "Glute Bridge March", sets: "3 sets", reps: "10 / side", weight: "Bodyweight", note: "Hips stay level the entire time. This is control, not speed." },
          ],
        },
        D2: {
          label: "Day 2 — Upper Body", sub: "Push + Pull · On Your Own",
          warmup: ["Band Pull-Apart — 15 reps", "Arm Circles — 10 each direction"],
          exercises: [
            { name: "Incline DB Press", sets: "3 sets", reps: "10–12 reps", weight: "25–30 lbs", note: "Neutral grip. Pause 1 sec at chest. No overhead loading." },
            { name: "Single-Arm DB Row", sets: "3 sets", reps: "10 / side", weight: "25–35 lbs", note: "Row to hip, not armpit. Hold 1 sec at top." },
            { name: "Single-Arm KB Press", sets: "3 sets", reps: "8 / side", weight: "15–20 lbs", note: "Brace core hard. Press straight up, not forward." },
            { name: "Lateral Raise (DB)", sets: "3 sets", reps: "12–15 reps", weight: "8–12 lbs", note: "3 sec up, 3 sec down. No swinging." },
            { name: "Band Pull-Apart", sets: "3 sets", reps: "15 reps", weight: "Light band", note: "Arms straight. Squeeze shoulder blades together at end range." },
          ],
        },
        D3: {
          label: "Day 3 — Total Body Balance", sub: "Core + Functional + Endurance",
          warmup: ["March in Place — 2 min", "Cat-Cow — 10 reps"],
          exercises: [
            { name: "Goblet Squat (KB)", sets: "3 sets", reps: "12 reps", weight: "20–25 lbs", note: "Elbows inside knees. Chest up. Sit into it." },
            { name: "Farmer Carry (DB)", sets: "3 sets", reps: "Down and back", weight: "25–30 lbs", note: "Tall spine. Shoulders packed. Own the room." },
            { name: "KB Swing", sets: "3 sets", reps: "15 reps", weight: "20–25 lbs", note: "Power from the hips, not the arms. Exhale at the top." },
            { name: "Dead Bug", sets: "3 sets", reps: "8 / side", weight: "Bodyweight", note: "Low back flat to floor. Breathe out on the lower." },
            { name: "Plank Hold", sets: "3 sets", reps: "30–45 sec", weight: "Bodyweight", note: "Hips level, ribs down. Quality over duration." },
            { name: "Mountain Climber", sets: "2–3 sets", reps: "30 sec", weight: "Bodyweight", note: "Controlled pace — not a race. Hips level throughout." },
          ],
        },
      };
      const w = WO[active];
      return (
        <div>
          <div style={S.pill}>3 days · on your own</div>
          <p style={S.intro}>Glute focus, upper body, and total body balance — three days to keep building between your sessions.</p>
          <div style={{ display: "flex", gap: "8px", marginBottom: "20px", flexWrap: "wrap" }}>
            {[["D1", "Day 1"], ["D2", "Day 2"], ["D3", "Day 3"]].map(([d, l]) => <button key={d} style={S.btn(active === d)} onClick={() => setActive(d)}>{l}</button>)}
          </div>
          <div style={S.section}>
            <div style={S.sTitle}>{w.label}</div>
            <div style={S.sSub}>{w.sub}</div>
            <div style={{ marginBottom: "14px" }}>
              <div style={{ fontSize: "10px", letterSpacing: "1.5px", textTransform: "uppercase", color: "#888", marginBottom: "8px" }}>Warm-Up</div>
              {w.warmup.map((wu, i) => <div key={i} style={{ fontSize: "13px", color: "#666", padding: "3px 0", fontStyle: "italic" }}>→ {wu}</div>)}
            </div>
            <div style={{ fontSize: "10px", letterSpacing: "1.5px", textTransform: "uppercase", color: "#888", marginBottom: "8px" }}>Exercises</div>
            {w.exercises.map((ex, i) => (
              <div key={i} style={{ ...S.row(i === w.exercises.length - 1), flexDirection: "column", alignItems: "stretch" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div style={S.rLabel}>{ex.name}</div>
                  <span style={S.tag("#3d5a47")}>{ex.sets}</span>
                </div>
                <div style={{ display: "flex", gap: "5px", marginTop: "5px", flexWrap: "wrap" }}>
                  <span style={S.tag("#888")}>{ex.reps}</span>
                  <span style={S.tag("#6b7c5c")}>{ex.weight}</span>
                </div>
                <div style={{ ...S.rNote, marginTop: "4px" }}>{ex.note}</div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function LiftsTab() {
      const [week, setWeek] = usePersist("lifts_week", 1);
      const [data, setData] = usePersist("lifts_data", {});
      const targets = { 1: "225", 2: "230", 3: "232", 4: "235" };
      const lifts = [["BB Hip Thrust", targets[week], "lbs · 8 reps"], ["Goblet Squat", "—", "lbs"], ["DB Chest Press", "—", "lbs"], ["Single-Arm Row", "—", "lbs"]];
      const set = (k, v) => setData((d) => ({ ...d, [`w${week}_${k}`]: v }));
      const get = (k) => data[`w${week}_${k}`] || "";
      const hasData = lifts.some((_, i) => get(`a${i}`) || get(`f${i}`)) || get("notes");
      return (
        <div>
          <div style={S.pill}>April progression</div>
          <p style={S.intro}>Track your lifts week by week. Actual weight, how it felt, and any notes.</p>
          <div style={{ display: "flex", gap: "8px", marginBottom: "20px", flexWrap: "wrap" }}>
            {[1, 2, 3, 4].map((w) => <button key={w} style={S.btn(week === w)} onClick={() => setWeek(w)}>Week {w}</button>)}
          </div>
          <div style={S.section}>
            <div style={S.sTitle}>Week {week} · Lift Tracker</div>
            <div style={S.sSub}>Target → Actual → Feel (1–5)</div>
            {lifts.map(([name, target, unit], i) => (
              <div key={i} style={{ ...S.row(i === lifts.length - 1), flexDirection: "column", alignItems: "stretch", paddingBottom: "12px" }}>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "6px" }}>
                  <div><div style={S.rLabel}>{name}</div><div style={S.rNote}>{unit}</div></div>
                  <div style={{ ...S.rRight, fontSize: "16px" }}>{target}</div>
                </div>
                <div style={{ display: "flex", gap: "8px" }}>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: "10px", color: "#888", marginBottom: "3px" }}>ACTUAL</div>
                    <input style={S.input} placeholder="___" value={get(`a${i}`)} onChange={(e) => set(`a${i}`, e.target.value)} />
                  </div>
                  <div style={{ width: "70px" }}>
                    <div style={{ fontSize: "10px", color: "#888", marginBottom: "3px" }}>FEEL</div>
                    <input style={S.input} placeholder="1–5" value={get(`f${i}`)} onChange={(e) => set(`f${i}`, e.target.value)} />
                  </div>
                </div>
              </div>
            ))}
            <div style={{ marginTop: "12px" }}>
              <div style={{ fontSize: "10px", color: "#888", marginBottom: "6px", letterSpacing: "1px", textTransform: "uppercase" }}>Session Notes</div>
              <textarea style={{ ...S.input, minHeight: "70px", resize: "vertical" }} placeholder="How did it feel? What moved well? What was hard?" value={get("notes")} onChange={(e) => set("notes", e.target.value)} />
            </div>
            {hasData && <div style={S.savedBadge}>✓ Saved automatically</div>}
          </div>
          <div style={S.note}>Hip thrust progression: 225 → 230 → 232 → 235. You already hit 235 fresh. This month we own it mid-ladder — after 33 prior reps. That is a completely different kind of strong.</div>
        </div>
      );
    }

    function App() {
      const [activeTab, setActiveTab] = usePersist("active_tab", "morning");
      const tabs = { morning: <MorningTab />, walk: <WalkTab />, nutrition: <NutritionTab />, fascia: <FasciaTab />, workouts: <WorkoutsTab />, lifts: <LiftsTab /> };
      return (
        <div style={S.app}>
          <div style={S.hero}>
            <div style={S.eyebrow}>Your Morning Practice</div>
            <div style={S.title}>Just for <span style={S.italic}>you</span> — before the world.</div>
            <div style={S.date}>{TODAY}</div>
          </div>
          <div style={S.tabBar}>
            {TABS.map((tab) => <button key={tab.id} style={S.tab(activeTab === tab.id)} onClick={() => setActiveTab(tab.id)}>{tab.label}</button>)}
          </div>
          <div style={S.body}>{tabs[activeTab]}</div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
