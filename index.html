<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Alli" />
  <title>Alli — Morning Practice</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: #f0ebe3; font-family: Georgia, serif; -webkit-font-smoothing: antialiased; }
    ::-webkit-scrollbar { display: none; }

    .hero { padding: 36px 24px 0; }
    .eyebrow { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #888; margin-bottom: 10px; }
    .hero-title { font-size: 30px; font-weight: normal; line-height: 1.2; margin-bottom: 6px; color: #1a1a1a; }
    .hero-italic { color: #4a6b56; font-style: italic; }
    .hero-date { font-size: 14px; color: #888; }

    .tab-bar { display: flex; border-bottom: 1px solid #ddd; padding: 0 24px; gap: 20px; overflow-x: auto; margin-top: 20px; -webkit-overflow-scrolling: touch; }
    .tab-btn { padding: 12px 0; font-size: 13px; color: #aaa; border: none; border-bottom: 2px solid transparent; background: transparent; cursor: pointer; white-space: nowrap; font-family: Georgia, serif; margin-bottom: -1px; }
    .tab-btn.active { color: #1a1a1a; font-weight: bold; border-bottom-color: #3d5a47; }

    .content { padding: 24px; max-width: 540px; margin: 0 auto; }

    .pill { display: inline-block; background: #e5e0d8; color: #555; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; padding: 5px 12px; border-radius: 20px; margin-bottom: 14px; }
    .intro { font-size: 15px; color: #555; line-height: 1.6; margin-bottom: 20px; }

    .check-card { background: #fff; border: 1px solid #e8e2da; border-radius: 16px; padding: 16px 18px; margin-bottom: 10px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: all 0.2s; }
    .check-card.done { background: #eaf0e8; border-color: #c8d8c2; }
    .check-icon { font-size: 22px; width: 32px; text-align: center; flex-shrink: 0; }
    .check-body { flex: 1; }
    .check-title { font-size: 15px; font-weight: bold; color: #1a1a1a; margin-bottom: 2px; }
    .check-card.done .check-title { color: #3d5a47; }
    .check-desc { font-size: 12px; color: #888; line-height: 1.4; }
    .toggle { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #ccc; background: transparent; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; font-size: 14px; color: transparent; }
    .check-card.done .toggle { border-color: #3d5a47; background: #3d5a47; color: #fff; }

    .section-card { background: #fff; border: 1px solid #e8e2da; border-radius: 16px; padding: 18px; margin-bottom: 12px; }
    .section-title { font-size: 16px; font-weight: bold; color: #1a1a1a; margin-bottom: 4px; }
    .section-sub { font-size: 11px; color: #888; letter-spacing: 0.5px; margin-bottom: 12px; }

    .row { display: flex; justify-content: space-between; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid #f5f0eb; }
    .row:last-child { border-bottom: none; }
    .row-label { font-size: 13px; font-weight: bold; color: #1a1a1a; flex: 1; }
    .row-note { font-size: 11px; color: #888; margin-top: 2px; line-height: 1.4; }
    .row-right { font-size: 12px; color: #3d5a47; font-weight: bold; text-align: right; flex-shrink: 0; margin-left: 12px; }

    .note-box { background: #f7f3ee; border: 1px solid #e8e2da; border-radius: 12px; padding: 14px 16px; margin-top: 14px; font-size: 12px; font-style: italic; color: #666; line-height: 1.6; }
    .success-box { background: #eaf0e8; border: 1px solid #c8d8c2; border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; font-size: 13px; color: #3d5a47; font-weight: bold; }
    .saved-badge { font-size: 10px; color: #3d5a47; font-style: italic; text-align: right; margin-top: 6px; }

    .day-btns { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .day-btn { padding: 7px 16px; border-radius: 20px; font-size: 12px; background: #e5e0d8; color: #555; border: none; cursor: pointer; font-family: Georgia, serif; transition: all 0.2s; }
    .day-btn.active { background: #3d5a47; color: #fff; font-weight: bold; }

    .warmup-label { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: #888; margin-bottom: 8px; }
    .warmup-item { font-size: 13px; color: #666; padding: 3px 0; font-style: italic; }

    .ex-row { padding: 10px 0; border-bottom: 1px solid #f5f0eb; }
    .ex-row:last-child { border-bottom: none; }
    .ex-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .ex-name { font-size: 13px; font-weight: bold; color: #1a1a1a; }
    .ex-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 4px; }
    .tag { display: inline-block; font-size: 10px; padding: 3px 10px; border-radius: 20px; color: #fff; }
    .tag-green { background: #3d5a47; }
    .tag-gray { background: #888; }
    .tag-olive { background: #6b7c5c; }
    .ex-note { font-size: 11px; color: #888; line-height: 1.4; }

    .lift-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    .lift-cell { background: rgba(0,0,0,0.04); padding: 8px; border-radius: 6px; font-size: 12px; text-align: center; }
    .lift-cell.header { background: #3d5a47; color: #fff; font-size: 10px; font-weight: bold; letter-spacing: 0.5px; }
    .lift-input { background: #f7f3ee; border: 1px solid #e8e2da; border-radius: 6px; color: #1a1a1a; padding: 5px; font-size: 12px; width: 100%; text-align: center; font-family: Georgia, serif; }
    textarea.lift-input { min-height: 60px; resize: vertical; text-align: left; }
    .lift-target { font-size: 16px; font-weight: bold; color: #3d5a47; }

    .arrow { color: #3d5a47; margin-right: 8px; flex-shrink: 0; }
  </style>
</head>
<body>

<div class="hero">
  <div class="eyebrow">Your Morning Practice</div>
  <div class="hero-title">Just for <span class="hero-italic">you</span> — before the world.</div>
  <div class="hero-date" id="today-date"></div>
</div>

<div class="tab-bar" id="tab-bar"></div>
<div class="content" id="content"></div>

<script>
// ── Date ─────────────────────────────────────────────────────────────────────
document.getElementById('today-date').textContent = new Date().toLocaleDateString('en-US', {weekday:'long',month:'long',day:'numeric'});

// ── Storage ───────────────────────────────────────────────────────────────────
const save = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
const load = (k,fb) => { try { const v=localStorage.getItem(k); return v?JSON.parse(v):fb; } catch(e){return fb;} };
const todayKey = () => new Date().toISOString().slice(0,10);

// ── Tabs ──────────────────────────────────────────────────────────────────────
const TABS = ['Ritual','Walk','Nutrition','Fascia','Workouts','Lifts'];
const TAB_IDS = ['morning','walk','nutrition','fascia','workouts','lifts'];
let currentTab = load('active_tab5','morning');

function renderTabs() {
  const bar = document.getElementById('tab-bar');
  bar.innerHTML = TAB_IDS.map((id,i) => `<button class="tab-btn ${currentTab===id?'active':''}" onclick="switchTab('${id}')">${TABS[i]}</button>`).join('');
}

function switchTab(id) {
  currentTab = id;
  save('active_tab5', id);
  renderTabs();
  renderContent();
}

// ── Morning ───────────────────────────────────────────────────────────────────
const MORNING_ITEMS = [
  {id:'water', icon:'💧', title:'16–20 oz Water', desc:'Before coffee. Before anything. Rehydrate from overnight.'},
  {id:'breathe', icon:'🌬️', title:'360 Breathing — 5 min', desc:'Lying on back, knees bent. Inhale — ribcage expands, belly rises, pelvic floor gently drops. Exhale slowly. Just breathe and feel.'},
  {id:'pelvic', icon:'🌿', title:'Pelvic Floor Check-In', desc:'One conscious release. Inhale and let the pelvic floor soften. Then one gentle lift on the exhale. Just to reconnect.'},
  {id:'gut', icon:'🫁', title:'Gut Check', desc:'Rate your digestion 1–5. If it\'s a 3 or below — flat water today, warm foods first.'},
  {id:'intention', icon:'✨', title:'Set One Intention', desc:'One word or one sentence. Write it or say it out loud. What does your body need from you today?'},
];

function renderMorning() {
  const key = 'morning_checks_' + todayKey();
  let checked = load(key, {});
  const done = Object.values(checked).filter(Boolean).length;
  let html = `<div class="pill">First thing · Every day</div>
    <p class="intro">Before everything else. These are yours. Check them off and start your day from a full place.</p>`;
  if(done === MORNING_ITEMS.length) html += `<div class="success-box">✓ Morning ritual complete. Your nervous system thanks you.</div>`;
  MORNING_ITEMS.forEach(item => {
    const on = !!checked[item.id];
    html += `<div class="check-card ${on?'done':''}" onclick="toggleMorning('${item.id}')">
      <div class="check-icon">${item.icon}</div>
      <div class="check-body"><div class="check-title">${item.title}</div><div class="check-desc">${item.desc}</div></div>
      <div class="toggle">${on?'✓':''}</div>
    </div>`;
  });
  if(done>0) html += `<div class="saved-badge">✓ Saved automatically</div>`;
  html += `<div class="note-box">From Christin: Your morning sets the tone for your nervous system for the entire day. You carry a stressful job into every afternoon — this practice is how you protect your body before the day takes over.</div>`;
  return html;
}

window.toggleMorning = function(id) {
  const key = 'morning_checks_' + todayKey();
  let checked = load(key, {});
  checked[id] = !checked[id];
  save(key, checked);
  renderContent();
};

// ── Walk ──────────────────────────────────────────────────────────────────────
const WALK_ITEMS = [
  {id:'walk', icon:'🚶‍♀️', title:'20–30 Minute Walk', desc:'Outdoors when possible. Treadmill is fine. Movement, not pace.'},
  {id:'nowork', icon:'📵', title:'No Work During Walk', desc:'No emails. No stressful podcasts. Music, something light, or nothing. This is decompression time.'},
  {id:'water', icon:'💧', title:'Bring Water', desc:'Sparkling or flat — based on your gut today. Lemon or lime. No sweetened drinks.'},
];

function renderWalk() {
  const key = 'walk_checks_' + todayKey();
  let checked = load(key, {});
  let html = `<div class="pill">Daily movement</div>
    <p class="intro">Walking is the most underrated tool you have. It lowers cortisol, supports gut motility, and costs you nothing.</p>`;
  WALK_ITEMS.forEach(item => {
    const on = !!checked[item.id];
    html += `<div class="check-card ${on?'done':''}" onclick="toggleWalk('${item.id}')">
      <div class="check-icon">${item.icon}</div>
      <div class="check-body"><div class="check-title">${item.title}</div><div class="check-desc">${item.desc}</div></div>
      <div class="toggle">${on?'✓':''}</div>
    </div>`;
  });
  const done = Object.values(checked).filter(Boolean).length;
  if(done>0) html += `<div class="saved-badge">✓ Saved automatically</div>`;
  html += `<div class="section-card"><div class="section-title">On High Stress Days</div><div class="section-sub">When your stress is a 4 or 5</div><p style="font-size:13px;color:#555;line-height:1.6">Walk instead of doing your extra workout. A 30-minute walk when you are running on empty does more for your body than a hard class would. This is not a lesser option — it is the smarter one.</p></div>`;
  html += `<div class="section-card"><div class="section-title">Timing</div>
    <div class="row"><div><div class="row-label">Morning walk</div><div class="row-note">Before cortisol from the workday builds</div></div><div class="row-right">Best</div></div>
    <div class="row"><div><div class="row-label">After dinner</div><div class="row-note">Supports blood sugar and digestion</div></div><div class="row-right">Great</div></div>
    <div class="row"><div><div class="row-label">Any time</div><div class="row-note">Done is better than perfect</div></div><div class="row-right">Good</div></div>
  </div>`;
  return html;
}

window.toggleWalk = function(id) {
  const key = 'walk_checks_' + todayKey();
  let checked = load(key, {});
  checked[id] = !checked[id];
  save(key, checked);
  renderContent();
};

// ── Nutrition ─────────────────────────────────────────────────────────────────
function renderNutrition() {
  return `<div class="pill">Protein · Fiber · Water</div>
    <p class="intro">Three rules. Every day. In that order.</p>
    <div class="section-card">
      <div class="section-title">The Three Rules</div><div class="section-sub">Non-negotiable</div>
      <div class="row"><div style="display:flex;gap:12px"><div style="background:#3d5a47;color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold;flex-shrink:0;margin-top:2px">1</div><div><div class="row-label">Protein first at every meal</div><div class="row-note">Eat protein before anything else. Stabilizes blood sugar, reduces cravings.</div></div></div></div>
      <div class="row"><div style="display:flex;gap:12px"><div style="background:#3d5a47;color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold;flex-shrink:0;margin-top:2px">2</div><div><div class="row-label">Fiber every day</div><div class="row-note">Vegetables, fruit, legumes, whole grains. Aim for 25g+.</div></div></div></div>
      <div class="row"><div style="display:flex;gap:12px"><div style="background:#3d5a47;color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold;flex-shrink:0;margin-top:2px">3</div><div><div class="row-label">Water all day</div><div class="row-note">Half your body weight in ounces. Sparkling with lemon/lime/cranberry counts. Flat on tough gut days.</div></div></div></div>
    </div>
    <div class="section-card">
      <div class="section-title">Protein by Meal</div>
      <div class="row"><div><div class="row-label">Breakfast</div><div class="row-note">Eggs + egg whites, Greek yogurt, or cottage cheese</div></div><div class="row-right">30–35g</div></div>
      <div class="row"><div><div class="row-label">Lunch</div><div class="row-note">Chicken, turkey, or fish with vegetables and a complex carb</div></div><div class="row-right">35–40g</div></div>
      <div class="row"><div><div class="row-label">Dinner</div><div class="row-note">Protein + carb + fat — balanced plate</div></div><div class="row-right">35–40g</div></div>
      <div class="row"><div><div class="row-label">Snack</div><div class="row-note">Greek yogurt, protein shake, hard boiled eggs</div></div><div class="row-right">20–25g</div></div>
    </div>
    <div class="section-card">
      <div class="section-title">Gut Health Notes</div>
      <div class="row"><div style="display:flex"><span class="arrow">→</span><span style="font-size:13px;color:#444;line-height:1.5">Chew slowly. Your gut starts in your mouth.</span></div></div>
      <div class="row"><div style="display:flex"><span class="arrow">→</span><span style="font-size:13px;color:#444;line-height:1.5">Warm foods first in the morning — easier on digestion.</span></div></div>
      <div class="row"><div style="display:flex"><span class="arrow">→</span><span style="font-size:13px;color:#444;line-height:1.5">Sparkling water is fine on calm gut days. Switch to flat when bloated.</span></div></div>
      <div class="row"><div style="display:flex"><span class="arrow">→</span><span style="font-size:13px;color:#444;line-height:1.5">Alcohol disrupts gut lining and worsens endo symptoms. Be honest about what it costs you.</span></div></div>
      <div class="row"><div style="display:flex"><span class="arrow">→</span><span style="font-size:13px;color:#444;line-height:1.5">If your gut is off — track what you ate 24 hours before. Patterns will appear.</span></div></div>
    </div>`;
}

// ── Fascia ────────────────────────────────────────────────────────────────────
function renderFascia() {
  const gun = [
    ['Upper back & traps','Medium speed. Move slowly. Don\'t park it.','60–90 sec / side'],
    ['Glutes','Just below the waistband. Full glute, not just center.','60 sec / side'],
    ['Hamstrings','Seated or face down. Long strokes sit bone to knee.','60 sec / side'],
    ['Hip flexors','Light pressure. Let it warm up first.','45 sec / side'],
    ['Thoracic spine','Either side of the spine — not directly on it.','60 sec'],
  ];
  const mob = [
    ['Child\'s Pose','Knees wide. Breathe into low back. Let hips sink.','60–90 sec'],
    ['Cat-Cow','Inhale into cow, exhale into cat. Move with breath.','10 slow reps'],
    ['Figure Four','Lying on back. Flex foot. Press knee gently away.','60 sec / side'],
    ['Thoracic Rotation','Side lying. Top arm opens to ceiling.','8 reps / side'],
    ['Hip Flexor Stretch','Low lunge. Tuck pelvis. Don\'t arch the low back.','45 sec / side'],
    ['90/90 Hip','Both legs at 90 degrees. Sit tall. Breathe in.','60 sec / side'],
  ];
  let html = `<div class="pill">5–15 min · Fascia release</div>
    <p class="intro">Lymphatic flow · nervous system reset · circulation primer</p>
    <div class="section-card"><div class="section-title">Massage Gun</div><div class="section-sub">Before workout or evening — not immediately post-workout</div>`;
  gun.forEach(([a,n,t]) => { html += `<div class="row"><div><div class="row-label">${a}</div><div class="row-note">${n}</div></div><div class="row-right">${t}</div></div>`; });
  html += `</div><div class="section-card"><div class="section-title">Mobility Sequence</div><div class="section-sub">Hold each. Breathe into it. Let breath create space.</div>`;
  mob.forEach(([n,note,h]) => { html += `<div class="row"><div><div class="row-label">${n}</div><div class="row-note">${note}</div></div><div class="row-right">${h}</div></div>`; });
  html += `</div>`;
  return html;
}

// ── Workouts ──────────────────────────────────────────────────────────────────
const WORKOUTS = {
  D1: {
    label:'Day 1 — Lower Body Power', sub:'Squat + Hip + Glute · On Your Own',
    warmup:['Banded Clamshell — 15 / side','Hip CARs — 5 / side','Goblet Squat hold — 30 sec'],
    exercises:[
      {name:'Landmine Hack Squat',sets:'4 sets',reps:'10 reps',weight:'Light–moderate',note:'Bar at shoulder, feet slightly forward. Sit down into it. Knees track over toes. Drive through heels.'},
      {name:'Landmine Split Squat',sets:'4 sets',reps:'8 / side',weight:'Light–moderate',note:'Bar at shoulder, back foot flat or elevated. Sit straight down. Front heel stays down.'},
      {name:'Sumo Deadlift (Barbell)',sets:'4 sets',reps:'8 reps',weight:'65–95 lbs',note:'Wide stance, toes out. Chest tall, hips low to start. Drive knees out as you pull. Completely different demand than your conventional RDL.'},
      {name:'KB Hip Thrust (heavy)',sets:'3 sets',reps:'15 reps',weight:'Heaviest KB available',note:'KB on hip, upper back on bench. Full hip extension at top. Squeeze hard every rep.'},
      {name:'Reverse Hyper on Bench',sets:'3 sets',reps:'15 reps',weight:'Bodyweight',note:'Face down on bench, legs hanging. Lift legs to hip height, squeeze glutes at top. Low back and glute finisher.'},
      {name:'Banded Glute Bridge Abduction',sets:'3 sets',reps:'20 reps',weight:'Band above knees',note:'Bridge up and hold. Drive knees out against the band 20 times. Glute med and glute max both firing.'},
    ]
  },
  D2: {
    label:'Day 2 — Upper Body', sub:'Push + Pull + Carry · Fresh Movements',
    warmup:['Scapular Wall Slide — 10 reps','Band Pull-Apart — 15 reps','Dead Hang — 20 sec if possible'],
    exercises:[
      {name:'Landmine Press (standing)',sets:'4 sets',reps:'10 / side',weight:'Light–moderate',note:'Standing, one arm. Press the bar up and slightly out. Core braced hard. Better shoulder position than overhead barbell.'},
      {name:'Barbell Bent-Over Row',sets:'4 sets',reps:'10 reps',weight:'45–65 lbs',note:'Hinge to 45 degrees. Row to lower chest. Squeeze shoulder blades. Control the lower.'},
      {name:'DB Chest Supported Row',sets:'3 sets',reps:'12 / side',weight:'25–35 lbs',note:'Incline bench, chest down. Row with full range. Takes the low back completely out of it.'},
      {name:'Cable or Band Tricep Pushdown',sets:'3 sets',reps:'15 reps',weight:'Light–moderate cable',note:'Elbows pinned to sides. Full extension at bottom. Squeeze. No swinging.'},
      {name:'DB Hammer Curl',sets:'3 sets',reps:'12 reps',weight:'15–20 lbs',note:'Neutral grip. Curl slow — 2 up, 3 down. No swinging.'},
      {name:'Suitcase Carry (one side)',sets:'3 sets',reps:'Down and back / side',weight:'30–40 lbs DB',note:'One DB, one side only. Stay tall — don\'t lean toward the weight. Core working overtime. Switch sides.'},
    ]
  },
  D3: {
    label:'Day 3 — Full Body Strength', sub:'Compound + Core + Conditioning',
    warmup:['Jump Rope or March — 3 min','World\'s Greatest Stretch — 3 / side','Cat-Cow — 10 reps'],
    exercises:[
      {name:'Barbell Back Squat',sets:'4 sets',reps:'8 reps',weight:'45–75 lbs',note:'Bar on upper traps. Feet shoulder width. Sit into it, drive knees out, chest tall. Primary lift today.'},
      {name:'Landmine Meadows Row',sets:'3 sets',reps:'10 / side',weight:'Moderate',note:'Staggered stance, one hand on end of bar. Row to hip. Massive range of motion. One of the best unilateral back exercises.'},
      {name:'KB Goblet Squat to Press',sets:'3 sets',reps:'10 reps',weight:'20–25 lbs KB',note:'Squat down with KB at chest, stand up and press overhead. Two movements in one. Legs, core, shoulders.'},
      {name:'Banded Hip Thrust (band across rack)',sets:'3 sets',reps:'25 reps',weight:'Band anchored across rack at hip height',note:'Loop the band across the rack uprights and over your hips. High reps, constant tension. Squeeze hard at the top every single rep. This one burns.'},
      {name:'Pallof Press (cable or band)',sets:'3 sets',reps:'12 / side',weight:'Light cable or band',note:'Stand sideways to the cable. Press straight out, hold 2 sec, return. Anti-rotation core work. Don\'t let your body turn.'},
      {name:'KB Goblet Squat Pulse',sets:'3 sets',reps:'20 pulses',weight:'20 lbs KB',note:'Sit at the bottom of a goblet squat and pulse. Inner thighs and quads on fire. Finisher.'},
    ]
  },
  D4: {
    label:'Day 4 — Mobility Flow', sub:'Athletic Mobility · Move Like a Workout',
    warmup:['Easy Walk — 3 min','Neck rolls — 5 each direction','Shoulder rolls — 10 reps'],
    exercises:[
      {name:'World\'s Greatest Stretch',sets:'3 rounds',reps:'5 / side',weight:'Bodyweight',note:'Lunge, rotate, reach to ceiling. Move through it continuously. Hip flexor, thoracic, hamstring all at once.'},

      {name:'Rack-Assisted Deep Squat + Rotate',sets:'3 rounds',reps:'8 rotations',weight:'Hold rack uprights',note:'Use the rack to sink deeper. Rotate side to side from the bottom. Ankles, hips, thoracic all opening up.'},
      {name:'Hip CARs',sets:'3 rounds',reps:'5 / side',weight:'Hold rack for balance',note:'Full slow circle of the hip joint. Maximum range of motion every rep. Do not rush this.'},
      {name:'Landmine Thoracic Rotation',sets:'3 rounds',reps:'8 / side',weight:'Very light',note:'Kneeling, hold end of bar at chest. Rotate slowly into full range. The weight pulls you deeper. This will unlock your upper back.'},
      {name:'Bear Crawl',sets:'3 rounds',reps:'Down and back',weight:'Bodyweight',note:'Knees hover 1 inch. Opposite hand and foot. Core on the entire time.'},
      {name:'Cossack Squat',sets:'3 rounds',reps:'6 / side',weight:'Bodyweight or light KB',note:'Wide stance, shift weight to one side and sink. Other leg stays straight. Deep inner thigh and hip opener. Go slow.'},
      {name:'Inchworm + Rotation',sets:'3 rounds',reps:'6 reps',weight:'Bodyweight',note:'Walk hands out to plank, rotate one arm to ceiling, walk back. Hamstrings, shoulders, thoracic all in one.'},
    ]
  }
};

function renderWorkouts() {
  const active = load('wo_day5','D1');
  const w = WORKOUTS[active] || WORKOUTS.D1;
  let html = `<div class="pill">4 days · on your own</div>
    <p class="intro">Fresh programming — squat patterns, landmine work, upper body variety, and mobility that actually feels like training.</p>
    <div class="day-btns">
      ${Object.keys(WORKOUTS).map(d => `<button class="day-btn ${active===d?'active':''}" onclick="switchDay('${d}')">${d==='D4'?'Mobility':'Day '+d.slice(1)}</button>`).join('')}
    </div>
    <div class="section-card">
      <div class="section-title">${w.label}</div>
      <div class="section-sub">${w.sub}</div>
      <div class="warmup-label" style="margin-top:8px">Warm-Up</div>
      ${w.warmup.map(wu=>`<div class="warmup-item">→ ${wu}</div>`).join('')}
      <div class="warmup-label" style="margin-top:14px;margin-bottom:4px">Exercises</div>
      ${w.exercises.map(ex=>`
        <div class="ex-row">
          <div class="ex-top"><div class="ex-name">${ex.name}</div><span class="tag tag-green">${ex.sets}</span></div>
          <div class="ex-tags"><span class="tag tag-gray">${ex.reps}</span><span class="tag tag-olive">${ex.weight}</span></div>
          <div class="ex-note">${ex.note}</div>
        </div>`).join('')}
    </div>`;
  return html;
}

window.switchDay = function(d) {
  save('wo_day5', d);
  renderContent();
};

// ── Lifts ─────────────────────────────────────────────────────────────────────
function renderLifts() {
  const week = load('lifts_week5', 1);
  const data = load('lifts_data5', {});
  const targets = {1:'225',2:'230',3:'232',4:'235'};
  const lifts = [['BB Hip Thrust',targets[week],'lbs · 8 reps'],['Barbell Back Squat','—','lbs'],['Bent-Over Row','—','lbs'],['Landmine Press','—','lbs / side']];

  let html = `<div class="pill">April progression</div>
    <p class="intro">Track your lifts week by week. Actual weight, how it felt, and any notes.</p>
    <div class="day-btns">
      ${[1,2,3,4].map(w=>`<button class="day-btn ${week===w?'active':''}" onclick="switchWeek(${w})">Week ${w}</button>`).join('')}
    </div>
    <div class="section-card">
      <div class="section-title">Week ${week} · Lift Tracker</div>
      <div class="section-sub">Target → Actual → Feel (1–5)</div>
      <div class="lift-grid" style="margin-top:12px">
        <div class="lift-cell header">LIFT</div>
        <div class="lift-cell header">TARGET</div>
        <div class="lift-cell header">ACTUAL</div>
        <div class="lift-cell header">FEEL</div>
      </div>`;

  lifts.forEach(([name,target,unit],i) => {
    const a = data[`w${week}_a${i}`]||'';
    const f = data[`w${week}_f${i}`]||'';
    html += `<div class="lift-grid">
      <div class="lift-cell" style="text-align:left;font-size:11px">${name}<br><span style="color:#888;font-size:9px">${unit}</span></div>
      <div class="lift-cell lift-target">${target}</div>
      <div class="lift-cell"><input class="lift-input" placeholder="___" value="${a}" onchange="saveLifts('a${i}',this.value)"></div>
      <div class="lift-cell"><input class="lift-input" placeholder="1–5" value="${f}" onchange="saveLifts('f${i}',this.value)"></div>
    </div>`;
  });

  const notes = data[`w${week}_notes`]||'';
  html += `<div style="margin-top:12px">
    <div class="warmup-label">Session Notes</div>
    <textarea class="lift-input" placeholder="How did it feel? What moved well? What was hard?" onchange="saveLifts('notes',this.value)">${notes}</textarea>
  </div>`;
  html += `</div><div class="note-box">Hip thrust progression: 225 → 230 → 232 → 235. You already hit 235 fresh. This month we own it mid-ladder — after 33 prior reps. That is a completely different kind of strong.</div>`;
  return html;
}

window.switchWeek = function(w) {
  save('lifts_week5', w);
  renderContent();
};

window.saveLifts = function(key, val) {
  const week = load('lifts_week5', 1);
  const data = load('lifts_data5', {});
  data[`w${week}_${key}`] = val;
  save('lifts_data5', data);
};

// ── Render ────────────────────────────────────────────────────────────────────
function renderContent() {
  const content = document.getElementById('content');
  switch(currentTab) {
    case 'morning': content.innerHTML = renderMorning(); break;
    case 'walk': content.innerHTML = renderWalk(); break;
    case 'nutrition': content.innerHTML = renderNutrition(); break;
    case 'fascia': content.innerHTML = renderFascia(); break;
    case 'workouts': content.innerHTML = renderWorkouts(); break;
    case 'lifts': content.innerHTML = renderLifts(); break;
  }
}

renderTabs();
renderContent();
</script>
</body>
</html>
